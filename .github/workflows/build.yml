name: Desktop builds
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:solver
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-${{ matrix.os }}
          path: out/make/**/*.zip
