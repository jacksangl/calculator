name: Desktop builds
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools dpkg fakeroot rpm
      - run: npm run setup:solver
      - run: npm test
      - if: runner.os != 'Linux'
        run: npm run make
      - if: runner.os == 'Linux'
        run: npm run build:linux -- --installers
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-${{ matrix.os }}
          path: out/make/**
